<option value="">Seleccioná una comisión</option>
{% for item in comisiones %}<option value="{{ item.id }}" {% if comision_seleccionada == item.id %}selected{% endif %}>{{ item.numero }} · {{ item.cohorte.anio }}</option>{% else %}<option value="" disabled>No hay comisiones para esta cohorte</option>{% endfor %}
{% if incluir_nueva|default(false) %}<option value="nueva" data-numero="nueva">Nueva comisión...</option>{% endif %}
